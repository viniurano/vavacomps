name: Vava Comps v4 - preencher regiao
on:
  workflow_dispatch:
    inputs:
      regiao:
        description: "Regiao VCT 2026 a preencher"
        required: true
        type: choice
        options:
          - americas
          - emea
          - pacific
          - china
      limite:
        description: "Maximo de series novas (0 = todas as pendentes)"
        required: true
        default: "0"
        type: string
permissions:
  contents: write
concurrency:
  group: vava-v4-coleta-regional
  cancel-in-progress: false
jobs:
  coleta:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - name: Coletar partidas da regiao
        run: python -m backend.v4_region "${{ inputs.regiao }}" "${{ inputs.limite }}"
      - name: Validar Python
        run: python -m compileall -q backend
      - name: Persistir JSONs
        run: |
          git config user.name "vava-comps-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados/v4/
          if ! git diff --cached --quiet; then
            git commit -m "data(v4): preencher VCT 2026 ${{ inputs.regiao }}"
            git push
          fi
