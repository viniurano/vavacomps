name: Vava Comps v4 - coleta agendada
on:
  workflow_dispatch:
    inputs:
      tarefa:
        description: "schedule (calendario) ou run (consultas vencidas)"
        required: true
        default: "schedule"
        type: choice
        options:
          - schedule
          - run
  # Agendamentos do GitHub Actions so rodam automaticamente na branch padrao.
  # Permanecem inativos nesta branch de desenvolvimento ate autorizacao de deploy.
  schedule:
    - cron: '0 3 * * *'   # 00:00 Brasilia (UTC-3)
    - cron: '5,20,35,50 * * * *' # checar fila a cada 15 minutos
permissions:
  contents: write
concurrency:
  group: vava-v4-coleta
  cancel-in-progress: false
jobs:
  coleta:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - name: Atualizar calendario ou series
        env:
          TASK: ${{ github.event_name == 'workflow_dispatch' && inputs.tarefa || (github.event.schedule == '0 3 * * *' && 'schedule' || 'run') }}
        run: python -m backend.v4_store "$TASK"
      - name: Persistir JSONs
        run: |
          git config user.name "vava-comps-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados/v4/
          if ! git diff --cached --quiet; then
            git commit -m "data(v4): sincronizar agenda e series"
            git push
          fi
