name: Vava Comps v4 - bootstrap manual
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: vava-v4-bootstrap
  cancel-in-progress: false
jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout da branch de desenvolvimento
        uses: actions/checkout@v4
        with:
          ref: feature/backend-dinamico-v3
          persist-credentials: true
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Instalar dependencias
        run: pip install -r backend/requirements.txt
      - name: Importar snapshots locais sem acessar VLR
        run: python -m backend.v4_store bootstrap
      - name: Salvar JSONs somente na branch de desenvolvimento
        run: |
          git config user.name "vava-comps-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados/v4/
          if ! git diff --cached --quiet; then
            git commit -m "data(v4): bootstrap inicial de snapshots"
            git push origin HEAD:feature/backend-dinamico-v3
          else
            echo "Nenhum JSON novo para salvar."
          fi
