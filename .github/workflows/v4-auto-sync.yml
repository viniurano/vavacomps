name: Vava v4 - sincronizacao automatica (branch de testes)
on:
  schedule:
    - cron: '15 3 * * *'
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      task:
        description: 'Tipo de execução'
        required: false
        type: choice
        options:
          - sync
          - team_refresh
          - americas_stage2_full
          - pacific_stage2_full
          - emea_stage2_full
          - china_stage2_full
          - masters_london_full
          - americas_split1_full
          - pacific_split1_full
          - emea_split1_full
        default: sync
      event_id:
        description: 'ID do campeonato para atualização manual'
        required: false
        type: string
      team_id:
        description: 'ID da equipe para atualização manual'
        required: false
        type: string
permissions:
  contents: write
concurrency:
  group: vava-v4-sync-automatico
  cancel-in-progress: false
jobs:
  coleta:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Usar codigo da v4 (nao modifica main)
        uses: actions/checkout@v4
        with:
          ref: feature/backend-dinamico-v3
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - name: Validar sintaxe do backend
        run: python -m compileall -q backend
      - name: Atualizar equipe solicitada pelo site
        if: github.event_name == 'workflow_dispatch' && inputs.task == 'team_refresh'
        run: python -m backend.v4_manual "${{ inputs.event_id }}" "${{ inputs.team_id }}"
      - name: Coletar Americas Stage 2 completo (todas as series pendentes)
        if: github.event_name == 'workflow_dispatch' && inputs.task == 'americas_stage2_full'
        run: python -m backend.v4_region americas 0 2977
      - name: Coletar Pacific Stage 2 completo (todas as series pendentes)
        if: github.event_name == 'workflow_dispatch' && inputs.task == 'pacific_stage2_full'
        run: python -m backend.v4_region pacific 0 2776
      - name: Coletar EMEA Stage 2 completo (todas as series pendentes)
        if: github.event_name == 'workflow_dispatch' && inputs.task == 'emea_stage2_full'
        run: python -m backend.v4_region emea 0 2976
      - name: Coletar China Stage 2 completo (todas as series pendentes)
        if: github.event_name == 'workflow_dispatch' && inputs.task == 'china_stage2_full'
        run: python -m backend.v4_region china 0 2978
      - name: Coletar Masters London completo (todas as series pendentes)
        if: github.event_name == 'workflow_dispatch' && inputs.task == 'masters_london_full'
        run: python -m backend.v4_event 2765 0
      - name: Coletar Americas Split 1 completo (todas as series pendentes)
        if: github.event_name == 'workflow_dispatch' && inputs.task == 'americas_split1_full'
        run: python -m backend.v4_region americas 0 2860
      - name: Coletar Pacific Split 1 completo (todas as series pendentes)
        if: github.event_name == 'workflow_dispatch' && inputs.task == 'pacific_split1_full'
        run: python -m backend.v4_region pacific 0 2775
      - name: Coletar EMEA Split 1 completo (todas as series pendentes)
        if: github.event_name == 'workflow_dispatch' && inputs.task == 'emea_split1_full'
        run: python -m backend.v4_region emea 0 2863
      - name: Descobrir torneios principais no VLR
        if: github.event_name == 'schedule' && github.event.schedule == '15 3 * * *' || (github.event_name == 'workflow_dispatch' && inputs.task != 'team_refresh' && inputs.task != 'pacific_split1_full' && inputs.task != 'emea_split1_full' && inputs.task != 'americas_stage2_full' && inputs.task != 'pacific_stage2_full' && inputs.task != 'emea_stage2_full' && inputs.task != 'china_stage2_full' && inputs.task != 'masters_london_full' && inputs.task != 'americas_split1_full')
        continue-on-error: true
        run: python -m backend.v4_discovery sync
      - name: Consultar calendario uma vez por dia
        if: github.event_name == 'schedule' && github.event.schedule == '15 3 * * *' || (github.event_name == 'workflow_dispatch' && inputs.task != 'team_refresh' && inputs.task != 'pacific_split1_full' && inputs.task != 'americas_stage2_full' && inputs.task != 'pacific_stage2_full' && inputs.task != 'emea_stage2_full' && inputs.task != 'china_stage2_full')
        run: python -m backend.v4_store schedule
      - name: Verificar series vencidas, somente eventos catalogados (ate 10 tentativas por execucao)
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.task != 'team_refresh' && inputs.task != 'pacific_split1_full' && inputs.task != 'americas_stage2_full' && inputs.task != 'pacific_stage2_full')
        run: python -m backend.v4_store run
      - name: Atualizar logos de todas as equipes V4
        if: always()
        continue-on-error: true
        run: python scripts/baixar_logos.py
      - name: Salvar apenas dados v4 na branch de testes
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados/v4/ img/teams/
          if ! git diff --cached --quiet; then
            git commit -m "data(v4): sincronizacao automatica controlada"
            git push origin HEAD:feature/backend-dinamico-v3
          fi
